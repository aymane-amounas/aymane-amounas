<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1b2230"/>
    </pattern>
    <radialGradient id="glow" cx="22%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f1a17"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="78%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#1f2630" stroke-width="1"/>

  <!-- top meta line -->
  <text x="60" y="66" fill="#3fb950" font-size="15" letter-spacing="3">// cs @ 18 · location: anywhere</text>

  <!-- name -->
  <text x="58" y="158" fill="url(#fade)" font-size="92" font-weight="700" letter-spacing="2">AYMANE</text>
  <text x="840" y="158" fill="#2d3340" font-size="92" font-weight="700" letter-spacing="2">_</text>

  <!-- tagline -->
  <text x="62" y="200" fill="#8b949e" font-size="20" letter-spacing="4">software · systems · security · ai · neurotech</text>

  <!-- terminal prompt -->
  <text x="62" y="252" font-size="18">
    <tspan fill="#3fb950">lethebyte@kali</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">./build.sh --break --understand --rebuild</tspan>
  </text>
  <rect x="648" y="238" width="11" height="20" fill="#3fb950">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
